[project]
name = "resemble-enhance"
version = "0.0.2"
description = "Speech denoising and enhancement with deep learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Resemble AI", email = "team@resemble.ai" }
]
dependencies = [
  "celluloid>=0.2.0",
  "librosa>=0.10.1",
  "pandas>=2.1.3",
  "matplotlib>=3.8.1",
  "numpy>=1.26.2",
  "omegaconf>=2.3.0",
  "ptflops>=0.7.1.2",
  "rich>=13.7.0",
  "scipy>=1.11.4",
  "soundfile>=0.12.1",
  "torch>=2.1.1",
  "torchaudio>=2.1.1",
  "tqdm>=4.66.1",
  "resampy>=0.4.2",
  "tabulate>=0.8.10",
]

[project.optional-dependencies]
train = [
    "deepspeed>=0.12.4"
]
ui = [
  "gradio>=4.8.0",
]

[project.urls]
Homepage = "https://github.com/resemble-ai/resemble-enhance"

[project.scripts]
resemble-enhance = "resemble_enhance.enhancer.__main__:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["resemble_enhance"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }


[tool.black]
line-length = 120
target-version = ['py310']

[tool.isort]
line_length = 120
