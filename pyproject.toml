[project]
name = "resemble-enhance"
version = "0.0.2"
description = "Speech denoising and enhancement with deep learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Resemble AI", email = "team@resemble.ai" }
]
dependencies = [
  "celluloid>=0.2.0",
  "librosa>=0.10.1",
  "pandas>=2.1.3",
  "matplotlib>=3.8.1",
  "numpy>=1.26.2",
  "omegaconf>=2.3.0",
  "ptflops>=0.7.1.2",
  "rich>=13.7.0",
  "scipy>=1.11.4",
  "soundfile>=0.12.1",
  "torch>=2.1.1",
  "torchaudio>=2.1.1",
  "safetensors>=0.5.3",
  "tqdm>=4.66.1",
]

[project.optional-dependencies]
train = [
    "deepspeed>=0.12.4"
]

[project.urls]
Homepage = "https://github.com/resemble-ai/resemble-enhance"

[build-system]
requires = [
    "hatchling>=1.25.0",
]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["resemble_enhance"]

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
